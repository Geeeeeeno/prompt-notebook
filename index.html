<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a2240" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="ComfyUI / Animagine XL 4.0 向け画像生成プロンプト帳"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
    <title>AIイラスト プロンプト帳</title>
  </head>
  <body>
    <canvas id="bg-canvas" aria-hidden="true"></canvas>

    <header class="app-header">
      <div class="brand">
        <span id="brand-logo" class="brand-logo-wrap" aria-hidden="true"></span>
        <div class="brand-text">
          <div class="brand-title">
            <span class="brand-title-sub">AIイラスト</span>
            <span class="brand-title-main">プロンプト帳</span>
          </div>
          <div class="brand-sub">Animagine XL 4.0 / ComfyUI</div>
        </div>
      </div>
      <div class="header-actions">
        <button
          type="button"
          class="btn btn-new-header"
          id="btn-new-header"
          aria-label="新規プロンプト"
        >
          <span data-icon="add"></span>
          <span class="btn-new-label">新規</span>
        </button>
        <button
          type="button"
          class="icon-btn"
          id="btn-mute"
          aria-label="効果音のオンオフ"
          title="効果音"
        ></button>
        <button
          type="button"
          class="icon-btn"
          id="btn-install"
          aria-label="アプリをインストール"
          title="インストール"
          hidden
        ></button>
        <button
          type="button"
          class="icon-btn"
          id="btn-settings"
          aria-label="設定とインポートエクスポート"
          title="設定"
        ></button>
      </div>
    </header>

    <div class="app-shell">
      <div class="toolbar">
        <div class="search-row">
          <label class="search-box" for="search-input">
            <span id="search-icon" aria-hidden="true"></span>
            <input
              id="search-input"
              type="search"
              placeholder="タイトル・本文・タグを検索"
              autocomplete="off"
              enterkeyhint="search"
            />
          </label>
          <button type="button" class="btn btn-new-inline" id="btn-new-desktop">
            <span data-icon="add"></span>
            新規プロンプト
          </button>
        </div>
        <div class="filter-row">
          <button type="button" class="chip-toggle" id="btn-fav-filter" aria-pressed="false">
            <span id="fav-filter-icon" aria-hidden="true"></span>
            お気に入り
          </button>
          <select class="select-pill" id="sort-select" aria-label="並び替え">
            <option value="updatedAt:desc">更新日（新しい順）</option>
            <option value="updatedAt:asc">更新日（古い順）</option>
            <option value="createdAt:desc">作成日（新しい順）</option>
            <option value="createdAt:asc">作成日（古い順）</option>
            <option value="title:asc">タイトル（あいうえお）</option>
            <option value="title:desc">タイトル（逆順）</option>
          </select>
          <button type="button" class="chip-toggle" id="btn-tag-filter" aria-pressed="false">
            <span id="filter-icon" aria-hidden="true"></span>
            タグ
          </button>
        </div>
        <div class="tag-filter-scroll" id="tag-filter-list" hidden></div>
      </div>

      <div class="stats-row" id="stats-row" aria-label="統計"></div>

      <div class="main-layout">
        <main>
          <div class="card-grid" id="card-grid" aria-live="polite"></div>
          <div class="empty-state hidden" id="empty-state">
            <div class="empty-illust" id="empty-illust" aria-hidden="true"></div>
            <h2>プロンプトがありません</h2>
            <p>右下の追加ボタン、または「新規プロンプト」から作成できます。</p>
          </div>
        </main>
        <aside class="side-panel" aria-label="タグビルダー">
          <div class="panel-card" id="side-builder"></div>
        </aside>
      </div>
    </div>

    <nav class="bottom-bar" aria-label="メイン操作">
      <button type="button" class="bar-btn" id="btn-bar-search" aria-label="検索へ">
        <span data-icon="search"></span>
        検索
      </button>
      <button type="button" class="fab" id="btn-new" aria-label="新規プロンプト">
        <span data-icon="add"></span>
      </button>
      <button type="button" class="bar-btn" id="btn-bar-builder" aria-label="タグビルダー">
        <span data-icon="tag"></span>
        タグ
      </button>
    </nav>

    <div class="overlay" id="overlay" hidden></div>

    <!-- Editor sheet -->
    <section class="sheet" id="editor-sheet" role="dialog" aria-modal="true" aria-labelledby="editor-title" hidden>
      <div class="sheet-handle" aria-hidden="true"><span></span></div>
      <div class="sheet-header">
        <button type="button" class="icon-btn" id="editor-close" aria-label="閉じる"></button>
        <h2 id="editor-title">プロンプト編集</h2>
        <button type="button" class="icon-btn" id="editor-builder-open" aria-label="タグビルダーを開く"></button>
      </div>
      <div class="sheet-body">
        <form class="form-grid" id="editor-form">
          <div class="form-section">
            <h3 class="form-section-title">基本</h3>
            <div class="field">
              <label for="f-title">タイトル</label>
              <input id="f-title" name="title" required maxlength="120" />
            </div>
            <div class="field">
              <label for="f-positive">ポジティブ</label>
              <textarea id="f-positive" name="positive" rows="5" class="mono-field"></textarea>
            </div>
            <div class="field">
              <label for="f-negative">ネガティブ</label>
              <textarea id="f-negative" name="negative" rows="4" class="mono-field"></textarea>
              <div class="field-actions">
                <button type="button" class="btn" id="btn-insert-negative">
                  Animagine 4.0 推奨ネガティブを挿入
                </button>
              </div>
            </div>
            <div class="field">
              <label for="f-tags">タグ（カンマ区切り）</label>
              <input id="f-tags" name="tags" placeholder="夜, 桜, 制服" />
            </div>
          </div>

          <div class="form-section">
            <h3 class="form-section-title">生成パラメータ</h3>
            <div class="field-row">
              <div class="field">
                <label for="f-seed">Seed</label>
                <input id="f-seed" name="seed" type="number" />
              </div>
              <div class="field">
                <label for="f-steps">Steps</label>
                <input id="f-steps" name="steps" type="number" min="1" max="150" />
              </div>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="f-cfg">CFG</label>
                <input id="f-cfg" name="cfg" type="number" step="0.1" min="0" max="30" />
              </div>
              <div class="field">
                <label for="f-sampler">Sampler</label>
                <select id="f-sampler" name="sampler"></select>
              </div>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="f-scheduler">Scheduler</label>
                <select id="f-scheduler" name="scheduler"></select>
              </div>
              <div class="field">
                <label for="f-preset">解像度プリセット</label>
                <select id="f-preset" name="preset"></select>
              </div>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="f-width">幅</label>
                <input id="f-width" name="width" type="number" min="64" max="2048" step="8" />
              </div>
              <div class="field">
                <label for="f-height">高さ</label>
                <input id="f-height" name="height" type="number" min="64" max="2048" step="8" />
              </div>
            </div>
          </div>

          <div class="form-section">
            <h3 class="form-section-title">メモ・サムネイル</h3>
            <div class="field">
              <label for="f-memo">メモ</label>
              <textarea id="f-memo" name="memo" rows="3"></textarea>
            </div>
            <div class="field">
              <label>サムネイル</label>
              <div class="thumb-picker">
                <div class="thumb-preview" id="thumb-preview"></div>
                <div>
                  <input type="file" id="f-thumb" accept="image/*" class="sr-only" />
                  <button type="button" class="btn" id="btn-pick-thumb">
                    <span data-icon="image"></span>
                    画像を選択
                  </button>
                  <button type="button" class="btn btn-ghost" id="btn-clear-thumb">クリア</button>
                </div>
              </div>
            </div>
            <div class="field">
              <label for="f-quality-pos">品質タグの位置</label>
              <select id="f-quality-pos">
                <option value="end">末尾（推奨）</option>
                <option value="start">先頭</option>
              </select>
            </div>
          </div>
        </form>
      </div>
      <div class="sheet-footer">
        <button type="button" class="btn btn-ghost" id="editor-cancel">キャンセル</button>
        <button type="button" class="btn btn-primary" id="editor-save">
          <span data-icon="check"></span>
          保存
        </button>
      </div>
    </section>

    <!-- Detail sheet -->
    <section class="sheet" id="detail-sheet" role="dialog" aria-modal="true" aria-labelledby="detail-title" hidden>
      <div class="sheet-handle" aria-hidden="true"><span></span></div>
      <div class="sheet-header">
        <button type="button" class="icon-btn" id="detail-close" aria-label="閉じる"></button>
        <h2 id="detail-title">詳細</h2>
        <button type="button" class="icon-btn" id="detail-fav" aria-label="お気に入り"></button>
      </div>
      <div class="sheet-body" id="detail-body"></div>
      <div class="sheet-footer">
        <button type="button" class="btn" id="detail-edit">
          <span data-icon="edit"></span>
          編集
        </button>
        <button type="button" class="btn" id="detail-dup">
          <span data-icon="duplicate"></span>
          複製
        </button>
        <button type="button" class="btn btn-danger" id="detail-delete">
          <span data-icon="trash"></span>
          削除
        </button>
      </div>
    </section>

    <!-- Builder sheet (mobile bottom sheet) -->
    <section class="sheet sheet-builder" id="builder-sheet" role="dialog" aria-modal="true" aria-labelledby="builder-title" hidden>
      <div class="sheet-handle" id="builder-handle" aria-hidden="true"><span></span></div>
      <div class="sheet-header">
        <button type="button" class="icon-btn" id="builder-close" aria-label="閉じる"></button>
        <h2 id="builder-title">タグビルダー</h2>
        <button type="button" class="btn btn-ghost" id="builder-apply">反映</button>
      </div>
      <div class="sheet-body" id="builder-body"></div>
    </section>

    <!-- Settings sheet -->
    <section class="sheet" id="settings-sheet" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
      <div class="sheet-handle" aria-hidden="true"><span></span></div>
      <div class="sheet-header">
        <button type="button" class="icon-btn" id="settings-close" aria-label="閉じる"></button>
        <h2 id="settings-title">設定</h2>
      </div>
      <div class="sheet-body">
        <div class="form-grid">
          <div class="form-section">
            <h3 class="form-section-title">データ</h3>
            <div class="field">
              <div class="field-actions">
                <button type="button" class="btn" id="btn-export">
                  <span data-icon="download"></span>
                  JSONエクスポート
                </button>
                <button type="button" class="btn" id="btn-import">
                  <span data-icon="upload"></span>
                  JSONインポート
                </button>
                <input type="file" id="import-file" accept="application/json,.json" class="sr-only" />
              </div>
            </div>
          </div>
          <div class="form-section">
            <h3 class="form-section-title">タグビルダー</h3>
            <div class="field">
              <label for="setting-quality-pos">品質タグの位置</label>
              <select id="setting-quality-pos">
                <option value="end">末尾</option>
                <option value="start">先頭</option>
              </select>
            </div>
          </div>
          <div class="field" id="ios-install-hint" hidden>
            <label>ホーム画面に追加（iOS）</label>
            <p class="ios-hint">
              Safari の共有メニューから「ホーム画面に追加」を選ぶと、スタンドアロンアプリとして使えます。
            </p>
          </div>
          <div class="field">
            <label>について</label>
            <p class="ios-hint">
              バックエンドなし・ログインなし。データは端末内の IndexedDB に保存されます。
              GitHub Pages の /prompt-notebook/ でも相対パスで動作します。
            </p>
          </div>
        </div>
      </div>
    </section>

    <!-- Confirm / import modal -->
    <div class="modal" id="modal" role="alertdialog" aria-modal="true" aria-labelledby="modal-title" hidden>
      <h2 id="modal-title">確認</h2>
      <p id="modal-message"></p>
      <div class="modal-actions" id="modal-actions"></div>
    </div>

    <div class="toast-host" id="toast-host" aria-live="polite"></div>
    <div class="particle-layer" id="particle-layer" aria-hidden="true"></div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
